[project]
name = "all-store-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PollCode", email = "pollyasiel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "psycopg2-binary>=2.9.13",
    "pyjwt>=2.15.0",
    "slowapi>=0.1.10",
    "sqlmodel>=0.0.39",
]

[project.scripts]
all-store-api = "all_store_api:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"
pythonpath = ["."]

markers = [
    "auth: authentication tests",
    "users: user CRUD tests",
]