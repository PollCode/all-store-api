[project]
name = "all-store-api"
version = "0.1.0"
description = "Marketplace API for businesses and buyers"
readme = "README.md"
authors = [
    { name = "PollCode", email = "pollyasiel@gmail.com" }
]
requires-python = ">=3.13"

# ---------------------------------------------------------------------------
# Dependencias de PRODUCCIÓN
# Solo lo necesario para correr la app dentro del contenedor.
# NO usar `fastapi[standard]` aquí: arrastra `fastapi-cloud-cli` → `rignore`,
# que no se usa en runtime y rompe el build cuando la red falla.
# ---------------------------------------------------------------------------
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.6.0",
    "sqlmodel>=0.0.39",
    "alembic>=1.20.0",
    "psycopg2-binary>=2.9.13",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.0",
    "email-validator>=2.3.0",
    "slowapi>=0.1.10",
]

# ---------------------------------------------------------------------------
# Dependencias de DESARROLLO
# Aquí sí va `fastapi[standard]` para tener `fastapi dev` completo.
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
[tool.uv]
package = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"
pythonpath = ["."]

markers = [
    "auth: authentication tests",
    "users: user CRUD tests",
]

# ---------------------------------------------------------------------------
# FastAPI CLI (usado por `uv run fastapi dev`)
# ---------------------------------------------------------------------------
[tool.fastapi]
entrypoint = "main:app"